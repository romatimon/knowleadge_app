services:
  knowledge-app:
    image: rtimonin569/knowledge_app:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: knowledge-base-app
    ports:
      - "8501:8501"
    volumes:
      - ${HOST_DATA_DIR:-/home/roman/knowledge_app}/knowledge.db:/data/knowledge.db
      - ${HOST_DATA_DIR:-/home/roman/knowledge_app}/database.json:/data/database.json:ro
      - ${HOST_DATA_DIR:-/home/roman/knowledge_app}/backups:/data/backups
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATA_DIR: /data
      TZ: Europe/Moscow
