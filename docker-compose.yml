services:
  knowledge-app:
    image: rtimonin569/knowledge_app:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    container_name: knowledge-base-app
    ports:
      - "8501:8501"
    volumes:
      - ${HOST_DATA_DIR:?HOST_DATA_DIR is required}/knowledge.db:/data/knowledge.db
      - ${HOST_DATA_DIR:?HOST_DATA_DIR is required}/backups:/data/backups
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      DATA_DIR: /data
      TZ: Europe/Moscow
