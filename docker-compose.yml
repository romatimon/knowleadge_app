services:
  knowledge-app:
    build: .
    container_name: knowledge-base-app
    ports:
      - "8501:8501"
    volumes:
      - ./knowledge.db:/data/knowledge.db
      - ./database.json:/data/database.json:ro
      - ./backups:/data/backups
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATA_DIR: /data
      TZ: Europe/Moscow

